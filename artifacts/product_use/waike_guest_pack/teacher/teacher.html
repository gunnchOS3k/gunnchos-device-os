<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>WAIKE Teacher — GENERAL_IT</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;background:#eef2f7;color:#111}
.card{background:#fff;border:1px solid #ccd;padding:16px;margin:12px 0}
button{font-size:1.1rem;padding:10px 16px;margin:4px} #keys{font-family:monospace;white-space:pre-wrap;background:#111;color:#cfc;padding:8px}
</style></head><body>
<h1>WAIKE Teacher (instructor-only keys)</h1>
<p id="meta"></p>
<div class="card"><h3>Syllabus / lesson</h3><div id="lesson"></div></div>
<div class="card"><h3>Assign fixture cohort</h3>
<button id="assign">Assign quiz fixture to cohort-A</button></div>
<div class="card"><h3>Grade fixture</h3>
<button id="grade">Grade learner fixture submission</button>
<button id="load-keys">Load keys (teacher role)</button>
<pre id="keys">(keys not embedded — require X-WAIKE-Role: teacher via /teacher/keys)</pre></div>
<p id="status">ready</p>
<script>
const DATA = {"package_version": "owner-e4dd4df67f95", "course_id": "GENERAL_IT", "title": "General IT — Operator to Support Specialist", "lesson_id": "GENERAL_IT-w01", "lesson_title": "The Civic Tech Desk — three jobs a computer actually has", "lesson_body": "At the Gary Civic Tech Desk the machine in front of a patron is not a personality. It remembers (files), it calculates (apps), and it talks (network). Beginners freeze when a window disappears because they cannot name which of those three jobs failed. Ticket 4417 from the library kiosk is a remember-job failure: the essay lived in a browser temp store and the idle timer (1200 seconds) wiped the session. Naming the job changes the next action. You do not 'fix the Internet' for a missing file.\n\nOperator confidence is a spoken path. Say `Documents/waike/desk/4417` out loud before you copy anything. If that folder is missing, create it. Extra folders on the Desktop are clutter, not success. The lab marks required paths; it does not grade wallpaper.\n\nPrivacy is operational, not a poster. The desk forbids storing SSNs, library-card PANs, or passwords in ticket notes. If a patron dictates a password, you write 'credential reset requested' and walk them through a reset — you never type their secret into chat.\n\nThis week you will also meet the WAIKE Consensus Ladder in miniature: what you saw, what you inferred, what you still need. 'The kiosk is broken' is not an observation. 'Idle logout at 1200s discarded an unsaved textarea' is.", "worked_example": "Idle policy 1200s = 20 minutes. Patron sat down at 14:02, last keystroke 14:07, return 14:28. Session is gone. Restore from the auto-save folder if present; do not disable the timer as your first move — the timer is a shared-kiosk control.", "assignment": {"id": "a01", "prompt": "Build the required folder tree for ticket 4417, write a four-line operator journal (remember / calculate / talk / what broke), and describe one restore method that is not Ctrl+Z. No patron PII."}, "quiz": {"quiz_id": "GENERAL_IT-q01", "week": 1, "items": [{"id": "git-w1-1", "kind": "mcq", "stem": "Ticket 4417 lost an essay after 20 idle minutes. Which job failed first?", "choices": ["Remember (session/files)", "Talk (network)", "Calculate (CPU thermal)", "Print spooler"]}, {"id": "git-w1-2", "kind": "mcq", "stem": "Idle logout is 1200 seconds. How many minutes is that?", "choices": ["12", "20", "15", "1200"]}, {"id": "git-w1-3", "kind": "mcq", "stem": "A patron dictates a password at the desk. What do you record in the ticket?", "choices": ["The password in plaintext", "A screenshot of the login form", "'credential reset requested' and no secret", "The library card PAN"]}, {"id": "git-w1-4", "kind": "mcq", "stem": "Which statement is an observation, not an inference?", "choices": ["The kiosk is broken", "The Internet is down", "Someone hacked the kiosk", "The textarea was empty after idle logout at 14:28"]}, {"id": "git-w1-5", "kind": "mcq", "stem": "Why does the lab mark extra Desktop folders as clutter?", "choices": ["Required paths are the contract; extras are not the job", "Desktop is faster storage", "Windows forbids Desktop folders", "Antivirus scans Desktop only"]}, {"id": "git-w1-6", "kind": "mcq", "stem": "Which restore method is acceptable for 4417 besides Undo?", "choices": ["Disable the idle timer forever", "Copy from auto-save or previous export if present", "Reimage the kiosk immediately", "Post the essay to Discord"]}]}};
const ROLE_HEADERS = {'X-WAIKE-Role':'teacher', 'Content-Type':'application/json'};
document.getElementById('meta').textContent = DATA.course_id + ' · teacher view (keys not in HTML)';
document.getElementById('lesson').textContent = (DATA.lesson_body||'').slice(0,1200);
let cachedKeys = null;
async function loadKeys(){
  const r = await fetch('/teacher/keys', {headers:{'X-WAIKE-Role':'teacher'}});
  if(!r.ok){ document.getElementById('keys').textContent = 'forbidden '+r.status; return null; }
  cachedKeys = await r.json();
  document.getElementById('keys').textContent = JSON.stringify(cachedKeys, null, 2);
  return cachedKeys;
}
async function post(kind, extra){
  const body = Object.assign({kind, role:'teacher', course_id: DATA.course_id, ts: Date.now()}, extra||{});
  await fetch('/teacher', {method:'POST', headers: ROLE_HEADERS, body: JSON.stringify(body)});
  document.getElementById('status').textContent = kind + ' ok';
}
document.getElementById('load-keys').onclick = () => loadKeys();
document.getElementById('assign').onclick = () => post('assign_fixture', {cohort:'cohort-A', quiz_id: (DATA.quiz||{}).quiz_id});
document.getElementById('grade').onclick = async () => {
  const keys = cachedKeys || await loadKeys() || {};
  post('grade_fixture', { learner_choice: 0, rubric: 'fixture-rubric-v1', keys_ref: 'teacher/keys' });
};
</script></body></html>
