# GunnchOS Streaming Service Certification Tracker
# Phase 4E — readiness and evidence tracking only; no false certification claims.
# certification_status values:
#   not_started | browser_route_prototype | readiness_prototype | tested_unverified | certified
# certified requires evidence_path pointing to a real test report or partner certification letter.

schema_version: "1.0"
last_updated: "2026-07-02"
claim_boundary: >-
  GunnchOS does not claim official Netflix, Hulu, Disney+, Widevine, or other
  streaming service certification until partner certification or audited test
  evidence exists. DRM circumvention is not supported.

