<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>EXPERIMENTAL spatial-hub</title>
<style>
body{margin:0;min-height:100vh;background:#0c1218;color:#e8eef4;font-family:system-ui;display:grid;place-items:center}
.badge{position:fixed;top:12px;left:12px;padding:6px 10px;border:1px solid #d4a017;color:#d4a017;letter-spacing:.08em;font-size:12px}
.hub{width:min(420px,90vw);aspect-ratio:1;border:1px dashed #2a3846;border-radius:50%;display:grid;place-items:center;position:relative}
.hub span{position:absolute;font-size:12px;color:#8fa0b0}
.hub span:nth-child(1){top:8%;left:42%}
.hub span:nth-child(2){top:30%;right:8%}
.hub span:nth-child(3){bottom:28%;right:12%}
.hub span:nth-child(4){bottom:10%;left:40%}
.hub span:nth-child(5){top:35%;left:6%}
.core{width:88px;height:88px;border-radius:50%;background:#d4a017;color:#1a1404;display:grid;place-items:center;font-weight:700}
</style></head><body>
<div class="badge">EXPERIMENTAL — NOT PRODUCTION UI</div>
<div class="hub"><span>Vault</span><span>Apps</span><span>Connect</span><span>Care</span><span>Wallet</span><div class="core">Home</div></div>
</body></html>
