<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>EXPERIMENTAL adaptive-canvas</title>
<style>
body{margin:0;background:#0c1218;color:#e8eef4;font-family:system-ui;padding:24px}
.badge{display:inline-block;padding:6px 10px;border:1px solid #d4a017;color:#d4a017;letter-spacing:.08em;font-size:12px;margin-bottom:16px}
.canvas{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cell{flex:1;min-width:120px;min-height:72px;border:1px solid #2a3846;border-radius:10px;background:#162029;padding:12px}
@media(max-width:600px){.cell{min-width:100%}}
</style></head><body>
<div class="badge">EXPERIMENTAL — NOT PRODUCTION UI</div>
<p>Adaptive density sketch — not wired to production shell.</p>
<div class="canvas"><div class="row"><div class="cell">Dense</div><div class="cell">Comfort</div><div class="cell">Large</div></div></div>
</body></html>
