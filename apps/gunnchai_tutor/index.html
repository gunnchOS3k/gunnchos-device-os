<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>gunnchAI Tutor</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>gunnchAI Tutor</h1>
    <p>Local-first tutoring · AI suggests · human verifies · WAIKE lesson binding</p>
  </header>
  <main class="grid">
    <section>
      <h2>Session</h2>
      <label>Profile
        <select id="profile"><option>student</option><option>educator</option><option>coder</option></select>
      </label>
      <label>Topic <input id="topic" value="wireless_basics"/></label>
      <label>WAIKE lesson
        <select id="lesson">
          <option>wireless_basics_101</option>
          <option>waike_gary_upnow_intro</option>
          <option>python_starter_pack</option>
          <option value="">(none)</option>
        </select>
      </label>
    </section>
    <section>
      <h2>Ask</h2>
      <textarea id="prompt" rows="5">Explain OFDM at a high level</textarea>
      <button id="ask">Ask tutor</button>
      <p class="hint">Companion shell — real replies come from the gunnchSDK Python app runtime.</p>
    </section>
    <section>
      <h2>Reply</h2>
      <pre id="reply">Waiting for a question…</pre>
      <p id="safety">Safety: local gates on</p>
    </section>
    <section>
      <h2>Memory (local)</h2>
      <pre id="memory">[]</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
