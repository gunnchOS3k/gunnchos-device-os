    blocked_apps:
    - steam
    - netflix
    - hulu
    - wsl_ubuntu
    default_accessibility_settings:
      simplified_language: true
      captions_preference: always
    recommended_widgets:
    - lesson_deploy
    - student_roster
    - assignment_tracker
    data_privacy_policy: classroom_aggregate_only
    performance_profile: balanced
    onboarding_text: Classroom mode helps teachers deploy lessons, monitor progress, and keep students on task.
    exit_paths:
    - bicycle
    - car
    - library
  library:
    home_screen_layout: kiosk_simple
    allowed_apps:
    - browser
    - waike_offline
    - gunnchai3k
    - placeholder_catalog_reader
