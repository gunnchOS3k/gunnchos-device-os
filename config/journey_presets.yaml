    - vscode
    - terminal
    - wsl_ubuntu
    - netflix
    - hulu
    default_accessibility_settings:
      reduced_motion: true
      focus_mode: true
      large_text: true
    recommended_widgets:
    - catalog_search
    - session_timer
    - accessibility_help
    data_privacy_policy: public_kiosk_ephemeral_sessions
