    - build_status
    - terminal_sessions
    data_privacy_policy: developer_local_with_opt_in_sync
    performance_profile: compute_boost
    onboarding_text: Workshop mode is your maker bench — code, build games, and iterate with full tools.
    exit_paths:
    - laboratory
    - spaceship
    - car
    - arcade
  laboratory:
    home_screen_layout: research_dashboard
    allowed_apps:
    - vscode
    - terminal
    - field_measurement
    - edge_io
    - browser
    - gunnchai3k
    - wsl_ubuntu
    blocked_apps:
    - steam
    - netflix
    - hulu
    default_accessibility_settings:
      keyboard_navigation: true
      screen_reader_labels: true
    recommended_widgets:
    - lab_notes
    - dataset_status
    - experiment_timer
    data_privacy_policy: research_strict_no_raw_capture
    performance_profile: measurement_stable
    onboarding_text: Laboratory mode supports careful experiments, datasets, and reproducible research workflows.
    exit_paths:
    - spaceship
    - workshop
    - classroom
  spaceship:
    home_screen_layout: power_user_multipanel
    allowed_apps:
    - vscode
    - terminal
    - wsl_ubuntu
    - field_measurement
    - edge_io
    - browser
    - gunnchai3k
    - steam
    blocked_apps: []
    default_accessibility_settings:
      keyboard_navigation: true
    recommended_widgets:
    - git_status
    - lab_notes
    - system_health
    - telemetry_consent
    data_privacy_policy: power_user_full_control
    performance_profile: maximum
    onboarding_text: Spaceship mode unlocks advanced layouts, deep tooling, and full customization for experts.
    exit_paths:
    - laboratory
    - workshop
    - car
  guardian:
    home_screen_layout: guardian_console
    allowed_apps:
    - browser
    - waike_offline
    - gunnchai3k
    - scaly_wings_edu
    - placeholder_family_hub
    blocked_apps:
    - steam
    - terminal
    - vscode
    - wsl_ubuntu
    - netflix
    - hulu
    - youtube
    default_accessibility_settings:
      simplified_language: true
      large_text: true
      focus_mode: true
    recommended_widgets:
    - guardian_summary
    - screen_time
    - approved_apps
    data_privacy_policy: family_strict_no_surveillance
    performance_profile: battery_saver
    onboarding_text: Guardian mode keeps young learners safe with approvals, time limits, and calm defaults.
    exit_paths:
    - scooter
    - bicycle
    - classroom
  classroom:
    home_screen_layout: teacher_roster_grid
    allowed_apps:
    - waike_offline
    - gunnchai3k
    - browser
    - scaly_wings_edu
