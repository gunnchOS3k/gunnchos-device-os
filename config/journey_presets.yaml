      audio_cues: true
    recommended_widgets:
    - game_library
    - controller_battery
    - playtime_timer
    data_privacy_policy: gaming_standard_with_parental_controls
    performance_profile: performance
    onboarding_text: Arcade mode puts games up front with controller-friendly navigation and playtime tools.
    exit_paths:
    - workshop
    - car
    - guardian
  workshop:
    home_screen_layout: developer_dock
    allowed_apps:
    - vscode
    - terminal
    - wsl_ubuntu
    - browser
    - gunnchai3k
    - placeholder_game_engine
    blocked_apps:
    - netflix
    - hulu
    default_accessibility_settings:
      keyboard_navigation: true
      focus_mode: true
    recommended_widgets:
