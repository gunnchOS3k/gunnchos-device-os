    onboarding_text: Library mode offers a calm kiosk experience for community learning and reference.
    exit_paths:
    - offline
    - scooter
    - bicycle
  offline:
    home_screen_layout: offline_essentials
    allowed_apps:
    - waike_offline
    - gunnchai3k
    - placeholder_offline_reader
    - placeholder_offline_notes
    blocked_apps:
    - steam
    - netflix
    - hulu
    - youtube
    - vscode
    - wsl_ubuntu
    default_accessibility_settings:
      simplified_language: true
      reduced_motion: true
      focus_mode: true
    recommended_widgets:
    - offline_lessons
    - download_queue
    - sync_status
    data_privacy_policy: offline_local_only
    performance_profile: battery_saver
    onboarding_text: Offline mode keeps learning and creating available without a network connection.
    exit_paths:
