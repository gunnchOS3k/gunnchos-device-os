presets:
  scooter:
    home_screen_layout: large_tiles_single_column
    allowed_apps:
    - waike_offline
    - gunnchai3k
    - browser
    - scaly_wings_edu
    blocked_apps:
    - steam
    - terminal
    - vscode
    - wsl_ubuntu
    - netflix
    - hulu
    default_accessibility_settings:
      large_text: true
      simplified_language: true
      reduced_motion: true
    recommended_widgets:
    - focus_timer
    - offline_lessons
    - guardian_summary
    data_privacy_policy: strict_minimal_collection
    performance_profile: battery_saver
    onboarding_text: Welcome aboard your scooter journey — big buttons, gentle guidance, and safe defaults.
    exit_paths:
    - bicycle
    - guardian
    - offline
  bicycle:
    home_screen_layout: two_column_guided
    allowed_apps:
    - waike_offline
    - gunnchai3k
    - browser
    - scaly_wings_edu
    - youtube
    blocked_apps:
    - steam
    - terminal
    - wsl_ubuntu
    default_accessibility_settings:
      simplified_language: true
      focus_mode: true
    recommended_widgets:
    - homework_tracker
    - reading_list
    - calendar_widget
    data_privacy_policy: school_safe_aggregate_opt_in
    performance_profile: balanced
    onboarding_text: Your bicycle journey adds a little speed — explore lessons, reading, and guided practice.
    exit_paths:
    - car
    - classroom
    - scooter
  car:
    home_screen_layout: grid_standard
    allowed_apps:
    - browser
    - vscode
    - terminal
    - waike_offline
    - gunnchai3k
    - youtube
    - netflix
    blocked_apps:
    - steam
    default_accessibility_settings: {}
    recommended_widgets:
    - calendar_widget
    - homework_tracker
    - focus_timer
    data_privacy_policy: standard_with_consent
    performance_profile: balanced
    onboarding_text: Car mode balances school, work, and everyday productivity with sensible guardrails.
    exit_paths:
    - workshop
    - studio
    - bicycle
    - classroom
  studio:
    home_screen_layout: creative_canvas
    allowed_apps:
    - browser
    - gunnchai3k
    - placeholder_daw
    - placeholder_art_canvas
    - placeholder_writer
    blocked_apps:
    - steam
    - wsl_ubuntu
    default_accessibility_settings:
      reduced_motion: true
      focus_mode: true
    recommended_widgets:
    - music_now_playing
    - project_shelf
    - focus_timer
    data_privacy_policy: creator_local_first
    performance_profile: creative_boost
    onboarding_text: Studio mode clears distractions so you can write, draw, compose, and publish.
    exit_paths:
    - car
    - arcade
    - workshop
  arcade:
    home_screen_layout: controller_first_grid
    allowed_apps:
    - steam
    - scaly_wings
    - edgegesture
    - browser
    - youtube
    blocked_apps:
    - vscode
    - wsl_ubuntu
    - field_measurement
    default_accessibility_settings:
