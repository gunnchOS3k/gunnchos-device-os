packs:
  learn_pack:
    apps:
    - waike_offline
    - gunnchai3k
    - browser
    - scaly_wings_edu
    why_it_exists: Core learning path for students at any level with offline lessons and tutoring.
    required_mode: bicycle
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Start here for homework help, guided lessons, and safe browsing.
    compatible_modes:
    - scooter
    - bicycle
    - car
    - classroom
    - guardian
    - library
    - offline
  write_pack:
    apps:
    - placeholder_writer
    - placeholder_notes
    - browser
    - gunnchai3k
    why_it_exists: Writing, research, and presentation workflows for essays and reports.
    required_mode: studio
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Draft documents, take notes, and organize citations locally.
    compatible_modes:
    - car
    - studio
    - library
  art_pack:
    apps:
    - placeholder_art_canvas
    - placeholder_reference_library
    - browser
    why_it_exists: Digital art creation with local saves and reference tools.
    required_mode: studio
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Sketch, paint, and export artwork from a calm studio layout.
    compatible_modes:
    - studio
    - car
  music_pack:
    apps:
    - placeholder_daw
    - placeholder_metronome
    - browser
    why_it_exists: Compose, record, and practice music with studio-oriented tools.
    required_mode: studio
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Make tracks, tune instruments, and save projects locally.
    compatible_modes:
    - studio
  game_pack:
    apps:
    - steam
    - scaly_wings
    - edgegesture
    - browser
    why_it_exists: Controller-first gaming with library management and playtime awareness.
    required_mode: arcade
    offline_support: true
    privacy_warning: Online games may share play activity; parental controls recommended for minors.
    beginner_friendly_description: Browse and launch games with controller-friendly navigation.
    compatible_modes:
    - arcade
    - car
  game_dev_pack:
    apps:
    - placeholder_game_engine
    - vscode
    - terminal
    - placeholder_asset_pipeline
    why_it_exists: Build and iterate games from prototype to playable demo.
    required_mode: workshop
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Use engine templates, code tools, and asset pipelines for game jams.
    compatible_modes:
    - workshop
    - arcade
  cs_student_pack:
    apps:
    - vscode
    - terminal
    - wsl_ubuntu
    - browser
    - placeholder_git_client
    why_it_exists: Computer science coursework with editors, terminals, and Git workflows.
    required_mode: workshop
    offline_support: false
    privacy_warning: Cloud Git remotes may transmit repository metadata; review consent settings.
    beginner_friendly_description: Code, test, and version-control class projects in one pack.
    compatible_modes:
    - workshop
    - car
    - laboratory
    - spaceship
  stem_lab_pack:
    apps:
    - field_measurement
    - edge_io
    - vscode
    - terminal
    - browser
    why_it_exists: STEM experiments including wireless measurement and data capture.
    required_mode: laboratory
    offline_support: false
    privacy_warning: Measurement exports may include device identifiers; scrub before sharing.
    beginner_friendly_description: Run labs, capture datasets, and analyze results with research tools.
    compatible_modes:
    - laboratory
    - spaceship
    - workshop
  cybersecurity_pack:
    apps:
    - placeholder_security_lab
    - terminal
    - vscode
    - browser
    why_it_exists: Ethical security learning in isolated sandbox environments.
    required_mode: laboratory
    offline_support: true
    privacy_warning: Never run security labs against networks you do not own or lack permission to test.
    beginner_friendly_description: Practice defensive skills with guided, sandboxed exercises.
    compatible_modes:
    - laboratory
    - workshop
  hardware_maker_pack:
    apps:
    - placeholder_circuit_lab
    - placeholder_firmware_ide
    - terminal
    - vscode
    why_it_exists: Electronics design, firmware flashing, and bench testing.
    required_mode: workshop
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Prototype circuits and flash boards from a maker-focused bench.
    compatible_modes:
    - workshop
    - laboratory
  research_pack:
    apps:
    - vscode
    - terminal
    - field_measurement
    - edge_io
    - browser
    why_it_exists: Graduate-level research with reproducibility and measurement exports.
    required_mode: laboratory
    offline_support: false
    privacy_warning: Research exports must exclude raw private traffic; use privacy filters before upload.
    beginner_friendly_description: Organize experiments, notes, and datasets on a research bench.
    compatible_modes:
    - laboratory
    - spaceship
  community_library_pack:
    apps:
    - browser
    - waike_offline
    - gunnchai3k
    - placeholder_catalog_reader
    why_it_exists: Public kiosk and community learning with ephemeral sessions.
    required_mode: library
    offline_support: true
    privacy_warning: Shared devices clear sessions on logout; do not enter personal credentials.
    beginner_friendly_description: Browse catalogs and lessons without leaving a personal footprint.
    compatible_modes:
    - library
    - offline
    - scooter
  offline_essentials_pack:
    apps:
    - waike_offline
    - gunnchai3k
    - placeholder_offline_reader
    - placeholder_offline_notes
    why_it_exists: Core tools that work without continuous connectivity.
    required_mode: offline
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Keep learning and note-taking available when the network is unavailable.
    compatible_modes:
    - offline
    - scooter
    - bicycle
    - guardian
  accessibility_essentials_pack:
    apps:
    - waike_offline
    - gunnchai3k
    - browser
    - placeholder_voice_nav
    why_it_exists: Inclusive defaults for navigation, reading, and input assistance.
    required_mode: scooter
    offline_support: true
    privacy_warning: null
    beginner_friendly_description: Large text, voice input, and guided navigation out of the box.
    compatible_modes:
    - scooter
    - guardian
    - library
    - offline
