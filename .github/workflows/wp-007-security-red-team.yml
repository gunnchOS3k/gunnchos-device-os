name: wp-007-security-red-team

on:
  pull_request:
    paths:
      - "gunnchos_device_os/security_red_team/**"
      - "gunnchos_device_os/security/wp007/**"
      - "gunnchos_device_os/phase_xiv/fabric/**"
      - "gunnchos_device_os/phase_xiv/continuity/**"
      - "gunnchos_device_os/phase_xiv/packages/**"
      - "gunnchos_device_os/runtime/adapters.py"
      - "gunnchos_device_os/stage2/security/**"
      - "gunnchos_device_os/device_lab/session.py"
      - "gunnchos_device_os/gunnchai_integration.py"
      - "gunnchos_device_os/ota_state_machine.py"
      - "gunnchos_device_os/unified_identity.py"
      - "gunnchos_device_os/sandbox_policy.py"
      - "tests/wp007/**"
      - "docs/security/wp007/**"
      - "security/wp007_red_team/**"
      - "artifacts/wp007/**"
      - "scripts/run_wp007_red_team.py"
      - "scripts/validate_wp007_evidence_consistency.py"
      - ".github/workflows/wp-007-security-red-team.yml"
  workflow_dispatch:

jobs:
  digital-red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure main ref for evidence SHA checks
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          git rev-parse HEAD
          git rev-parse origin/main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install pytest cryptography
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: WP-007 red-team harness
        run: PYTHONPATH=.:src python3 scripts/run_wp007_red_team.py
      - name: WP-007 evidence consistency
        run: PYTHONPATH=.:src python3 scripts/validate_wp007_evidence_consistency.py
      - name: WP-007 pytest
        run: PYTHONPATH=.:src pytest -q tests/wp007
      - name: Related boundary regressions
        run: |
          PYTHONPATH=.:src pytest -q \
            tests/test_unified_identity.py \
            tests/test_ota_state_machine.py \
            tests/test_sandbox_policy.py \
            tests/phase_xiv/test_phase_xiv.py \
            tests/stage2/test_security.py \
            tests/test_continuation_vi_security.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp007-red-team
          path: artifacts/wp007/
