name: CI

on:
  push:
    branches: [main, develop, 'phase-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Generate demo outputs
        run: |
          PYTHONPATH=. python3 scripts/run_user_focused_os_demo.py
          PYTHONPATH=. python3 scripts/run_mode_policy_demo.py
          PYTHONPATH=. python3 scripts/run_deploy_contract_demo.py
          PYTHONPATH=. python3 scripts/run_privacy_security_demo.py
          PYTHONPATH=. python3 scripts/run_edge_io_contract_demo.py
          PYTHONPATH=. python3 scripts/run_waike_integration_demo.py
          PYTHONPATH=. python3 scripts/run_guardian_policy_demo.py
          PYTHONPATH=. python3 scripts/run_device_os_demo.py
          PYTHONPATH=. python3 scripts/run_hardware_compatibility_demo.py
          PYTHONPATH=. python3 scripts/run_hardware_boot_readiness_demo.py
          PYTHONPATH=. python3 scripts/run_device_specific_mode_demo.py
          test -f results/user_focused_os_demo_output.json
          test -f results/mode_policy_demo_output.json
          test -f results/ds_xl_deploy_demo_output.json
          test -f results/device_os_evt1_demo_output.json
          test -f results/hardware_compatibility_demo_output.json
          test -f results/hardware_boot_readiness_demo_output.json
          test -f results/device_specific_mode_demo_output.json
      - name: Firmware compatibility sync and demos
        run: |
          PYTHONPATH=. python3 cross_repo_firmware_bridge/sync_firmware_contracts.py \
            --hardware-repo ../gunnchos-hardware-industrial-design || \
          PYTHONPATH=. python3 cross_repo_firmware_bridge/sync_firmware_contracts.py
          PYTHONPATH=. python3 scripts/run_firmware_probe_demo.py
          PYTHONPATH=. python3 scripts/run_firmware_compatibility_demo.py
          PYTHONPATH=. python3 scripts/run_capsule_update_client_demo.py
          test -f results/firmware_probe_demo_output.json
          test -f results/firmware_compatibility_demo_output.json
          test -f results/capsule_update_client_demo_output.json
          test -f results/firmware_contract_sync_report.json
          PYTHONPATH=. python3 scripts/validate_firmware_compat.py
          PYTHONPATH=. python3 scripts/validate_cross_repo_firmware_bridge.py
      - name: Component runtime simulation
        run: |
          python3 hardware_component_runtime/scripts/sync_component_stacks.py --use-fixtures
          python3 hardware_component_runtime/scripts/simulate_os_on_component_stack.py
          python3 hardware_component_runtime/scripts/validate_component_runtime.py
          PYTHONPATH=. python3 scripts/validate_no_stale_not_implemented_language.py
      - name: Validate OS alpha and shippable package
        run: |
          PYTHONPATH=. python3 scripts/validate_user_focused_os.py
          PYTHONPATH=. python3 scripts/validate_accessibility_coverage.py
          PYTHONPATH=. python3 scripts/validate_persona_coverage.py
          PYTHONPATH=. python3 scripts/validate_edge_case_coverage.py
          PYTHONPATH=. python3 scripts/validate_issue_closure.py
          PYTHONPATH=. python3 scripts/validate_shippable_requirements.py
          PYTHONPATH=. python3 scripts/validate_release_gates.py
          PYTHONPATH=. python3 scripts/validate_release_artifacts.py
          PYTHONPATH=. python3 scripts/validate_qa_package.py
          PYTHONPATH=. python3 scripts/validate_hardware_manifests.py
          PYTHONPATH=. python3 scripts/validate_hardware_compatibility.py
          PYTHONPATH=. python3 scripts/validate_hardware_release_evidence.py
      - name: Launcher contract export and freshness
        run: |
          python3 scripts/export_launcher_contract.py
          python3 scripts/check_launcher_contract_fresh.py
      - name: Run tests
        run: pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and test launcher mock
        run: |
          cd apps/launcher_mock
          npm ci || npm install
          npm run build
          npm test
      - name: Access risk intelligence smoke
        run: |
          python security/access-risk/attack_path_model.py
          python security/access-risk/least_privilege_recommender.py
          pytest -q tests/test_access_risk_model.py
