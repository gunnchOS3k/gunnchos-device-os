name: Device Lab profile drift + guest foundation

on:
  push:
    paths:
      - 'gunnchos_device_os/device_lab/**'
      - 'tests/device_lab/**'
      - 'os_build/bootable_reference/overlay/**'
      - '.github/workflows/device-lab-profile-guest.yml'
  pull_request:
    paths:
      - 'gunnchos_device_os/device_lab/**'
      - 'tests/device_lab/**'
      - 'os_build/bootable_reference/overlay/**'
      - '.github/workflows/device-lab-profile-guest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Profile sync verify (fail on stale RAM/storage/MPN)
        run: |
          PYTHONPATH=.:src python3 scripts/gunnchctl profile verify
          PYTHONPATH=.:src python3 -c "from gunnchos_device_os.device_lab import GUNNCHDEVICE_LAB_FULL_ECOSYSTEM_DIGITAL_COMPLETE as t; assert t is False"
      - name: Unit tests — profile + fidelity honesty
        run: |
          pip install pytest pyyaml
          PYTHONPATH=.:src pytest -q \
            tests/device_lab/test_wp011_profile_guest_foundation.py \
            tests/device_lab/test_wp011_live_run_input.py \
            tests/device_lab/test_wp011_wave3_virtio_ring.py \
            tests/device_lab/test_device_lab_foundation.py \
            -k 'not qemu_start and not live_display_path and not agent_path_or_honest and not start_session_real'

  qemu-guest-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-x86 qemu-utils
          qemu-system-aarch64 --version || true
          qemu-system-x86_64 --version || true
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Image inspect/verify (use cached bootable_reference if present)
        run: |
          PYTHONPATH=.:src python3 scripts/gunnchctl image inspect || true
          # Build only if cache/artifacts allow; offline if Alpine already cached
          if [ -f os_build/bootable_reference/artifacts/gunnchos-ref-initramfs.cpio.gz ]; then
            PYTHONPATH=.:src python3 scripts/gunnchctl image build --offline || \
              PYTHONPATH=.:src python3 scripts/gunnchctl image build
            PYTHONPATH=.:src python3 scripts/gunnchctl image verify
          else
            echo "Reference artifacts absent — attempting fetch build"
            PYTHONPATH=.:src python3 scripts/gunnchctl image build
            PYTHONPATH=.:src python3 scripts/gunnchctl image verify
          fi
      - name: QEMU live path test (PASS only if QEMU alive; else SKIPPED_ENVIRONMENT)
        env:
          GUNNCHDEVICE_LAB_BOOT_TIMEOUT: "120"
          GUNNCHDEVICE_LAB_MEMORY_MB: "512"
          # Prefer real virtio-serial; mailbox stub only as labeled fallback inside code
          GUNNCH_GUEST_AGENT_HOST_STUB: "0"
          # Prefer TCG when KVM present-but-denied on GitHub runners
          GUNNCHDEVICE_LAB_ACCEL: "tcg"
          # Lab guest image is Alpine aarch64 — never boot under x86_64 QEMU
          GUNNCHDEVICE_LAB_QEMU_ARCH: "aarch64"
          GUNNCHDEVICE_LAB_ENABLE_VIRTIO_GPU: "0"
        run: |
          PYTHONPATH=.:src pytest -q tests/device_lab/test_wp011_profile_guest_foundation.py -k 'qemu_start or start_session_real'
          PYTHONPATH=.:src pytest -q tests/device_lab/test_wp011_wave3_virtio_ring.py -k 'agent_path_or_honest' || true
          PYTHONPATH=.:src pytest -q tests/device_lab/test_wp011_live_run_input.py -k 'live_display_path' || true
          # Honesty: never promote skip to pass in evidence artifact
          PYTHONPATH=.:src python3 - <<'PY'
          from gunnchos_device_os.device_lab.virtualization.qemu_guest import environment_can_run_qemu, select_accel, lab_guest_image_arch
          from pathlib import Path
          import json
          root = Path('.').resolve()
          env = environment_can_run_qemu(repo_root=root)
          print(json.dumps(env, indent=2))
          assert env.get("SKIPPED_ENVIRONMENT") is False, "QEMU installed in this job — must not skip"
          assert lab_guest_image_arch(root) == "aarch64"
          assert env.get("arch") == "aarch64", "must select aarch64 emulator for Lab guest image"
          print(json.dumps(select_accel(env["arch"]), indent=2))
          PY
