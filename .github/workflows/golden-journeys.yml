name: Golden Journeys (WP-003)

on:
  pull_request:
    branches: [main, develop]
  push:
    paths:
      - "quality/golden_journeys/**"
      - "gunnchos_device_os/golden_journeys/**"
      - "gunnchos_device_os/device_lab/**"
      - "scripts/run_golden_journey_subset.py"
      - "scripts/validate_golden_journey_scorecards.py"
      - "scripts/recommend_merge_golden.py"
      - "tests/test_golden_journey_infrastructure.py"
      - "tests/device_lab/**"
      - ".github/workflows/golden-journeys.yml"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all ten supporting Golden Journeys"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: golden-journeys-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    name: Scorecard schema + fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip pytest pyyaml
      - name: Validate scorecards / matrix / verifier stubs
        env:
          PYTHONPATH: .:src
        run: |
          python3 scripts/validate_golden_journey_scorecards.py
          pytest -q tests/test_golden_journey_infrastructure.py

  supporting-subset:
    name: Supporting subset + S0/S1 merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip pytest pyyaml
      - name: Collect changed paths
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/changed_paths.txt || \
              git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/changed_paths.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_all }}" = "true" ]; then
            : > /tmp/changed_paths.txt
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD~1...HEAD > /tmp/changed_paths.txt || true
          fi
          echo "Changed paths:"
          cat /tmp/changed_paths.txt || true
      - name: Run supporting Golden Journey subset
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          mkdir -p artifacts/golden_journeys
          if [ "${{ steps.changes.outputs.run_all }}" = "true" ]; then
            python3 scripts/run_golden_journey_subset.py --all --json | tee artifacts/golden_journeys/ci_run.json
            python3 scripts/recommend_merge_golden.py --all
          else
            python3 scripts/run_golden_journey_subset.py --paths-file /tmp/changed_paths.txt --json | tee artifacts/golden_journeys/ci_run.json
            python3 scripts/recommend_merge_golden.py --paths-file /tmp/changed_paths.txt --skip-harness
          fi
      - name: Assert no independent / frontier / physical claims
        env:
          PYTHONPATH: .:src
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          for p in (root/'quality/golden_journeys/scorecards').glob('GOLDEN-*.scorecard.json'):
              d = json.loads(p.read_text())
              assert d['claim_boundary']['independent_verification_claimed'] is False
              assert d['claim_boundary']['physically_validated'] is False
              assert d['claim_boundary']['human_validated'] is False
              assert d['claim_boundary']['frontier_parity_claimed'] is False
              assert d['PHYSICAL_PENDING']['pending'] is True
              assert d['HUMAN_VALIDATION_PENDING']['pending'] is True
              if str(d.get('updated_by','')).startswith('implementer'):
                  assert d['INDEPENDENT_VERIFICATION']['status'] != 'PASS'
          print('claim boundary ok')
          PY
      - name: Upload supporting evidence
        uses: actions/upload-artifact@v4
        with:
          name: golden-journey-supporting-evidence
          path: |
            artifacts/golden_journeys/
            quality/golden_journeys/runs/
            quality/golden_journeys/scorecards/

  g04-privileged-net-audio:
    name: G04 privileged netns + virtual audio (E4 reference)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Rootful Linux reference job — must actually execute for GJ-DEFECT-005 E4 proof.
    # Unprivileged smoke remains FALLBACK_ONLY / NOT_E4_REFERENCE_PROOF.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install net + audio tooling
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # Pulse + ALSA only (PipeWire packages conflict with pulseaudio on Ubuntu noble).
          # Accepted equivalents: Pulse null-sink OR ALSA snd-aloop.
          sudo apt-get install -y --no-install-recommends \
            iproute2 iputils-ping \
            pulseaudio pulseaudio-utils \
            alsa-utils
          python -m pip install -U pip pytest pyyaml
      - name: Start PulseAudio for null-sink lifecycle
        run: |
          set -euo pipefail
          # Rootful reference: start a Pulse daemon the privileged job can talk to.
          # If Pulse fails, snd-aloop path in AudioBackend is the accepted equivalent.
          sudo pulseaudio --check 2>/dev/null || sudo pulseaudio --system --daemonize=true --exit-idle-time=-1 --disallow-exit || true
          pulseaudio --check 2>/dev/null || pulseaudio --start --exit-idle-time=-1 || true
          sleep 1
          pactl info 2>/dev/null | head -20 || sudo pactl info 2>/dev/null | head -20 || true
          # Prefer ALSA loopback as durable rootful fallback on runners without session Pulse.
          sudo modprobe snd-aloop || true
          cat /proc/asound/cards || true
      - name: Run privileged G04 netns + audio reference proof
        env:
          PYTHONPATH: .:src
          GUNNCHDEVICE_LAB_NETNS: "1"
          GUNNCHDEVICE_LAB_AUDIO_REAL: "1"
          GUNNCHDEVICE_LAB_PRIVILEGED_NET: "1"
          GUNNCHDEVICE_LAB_PRIVILEGED_AUDIO: "1"
          GUNNCHDEVICE_LAB_REQUIRE_E4_NET_AUDIO: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/device_lab/g04_privileged
          # Network + audio backends must run as root for netns / module paths.
          sudo -E env PYTHONPATH=.:src \
            GUNNCHDEVICE_LAB_NETNS=1 \
            GUNNCHDEVICE_LAB_AUDIO_REAL=1 \
            GUNNCHDEVICE_LAB_PRIVILEGED_NET=1 \
            GUNNCHDEVICE_LAB_PRIVILEGED_AUDIO=1 \
            GUNNCHDEVICE_LAB_REQUIRE_E4_NET_AUDIO=1 \
            XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}" \
            HOME="$HOME" \
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          from gunnchos_device_os.device_lab.hw_backends.network import NetworkBackend
          from gunnchos_device_os.device_lab.hw_backends.audio import AudioBackend
          from gunnchos_device_os.device_lab.scenarios.office_dock import run

          root = Path('.').resolve()
          net = NetworkBackend()
          start = net.start()
          assert start['mode'] == 'netns', start
          attach = net.dock_ethernet_attach()
          assert attach.get('e4_reference_proof') is True, attach
          assert (attach.get('packet_transfer') or {}).get('ok') is True, attach
          det = net.dock_ethernet_detach()
          assert det.get('ok') is True, det
          assert (det.get('cleanup') or {}).get('cleanup_verified') is True, det

          # Audio may need non-root Pulse; try root first then fall back to user pulse via sudo -u.
          aud = AudioBackend()
          astart = aud.start()
          aattach = aud.dock_attach()
          if not aattach.get('e4_reference_proof'):
              # Retry without forcing failure yet — office_dock will re-run under same env.
              print('audio_root_attempt', json.dumps(aattach, default=str)[:800])
          else:
              adet = aud.dock_detach()
              assert adet.get('disappeared') is True or adet.get('ok') is True, adet

          result = run(repo_root=root)
          out = root / 'artifacts/device_lab/g04_privileged/result.json'
          out.write_text(json.dumps(result, indent=2, default=str) + '\n', encoding='utf-8')
          print('VF2_REQUIRED_GOLDEN_BACKENDS', result.get('VF2_REQUIRED_GOLDEN_BACKENDS'))
          print('network', result.get('network_backend'))
          print('audio', result.get('audio_backend'))
          assert result['ok'] is True, result.get('errors')
          assert result['network_backend']['e4_reference_proof'] is True, result['network_backend']
          assert result['audio_backend']['e4_reference_proof'] is True, result['audio_backend']
          assert result['VF2_REQUIRED_GOLDEN_BACKENDS'] == 'PASS'
          assert result['VF2_UNPRIVILEGED_FALLBACK'] == 'AVAILABLE'
          assert result['VF3'] == 'MODELED_ONLY'
          assert result['VF4'] == 'PHYSICAL_PENDING'
          assert result['SILICON_EXACT_EMULATION'] is False
          print('G04 privileged E4 net+audio reference proof PASS (implementer; Independent pending)')
          PY
      - name: Unprivileged fallback remains available (NOT E4 reference)
        env:
          PYTHONPATH: .:src
        run: |
          python3 - <<'PY'
          from gunnchos_device_os.device_lab.hw_backends.network import NetworkBackend
          from gunnchos_device_os.device_lab.hw_backends.audio import AudioBackend
          net = NetworkBackend()
          net.start()
          a = net.dock_ethernet_attach()
          assert a.get('FALLBACK_ONLY') is True
          assert a.get('e4_reference_proof') is False
          assert a.get('NOT_E4_REFERENCE_PROOF') is True
          aud = AudioBackend()
          aud.start()
          b = aud.dock_attach()
          assert b.get('FALLBACK_ONLY') is True
          assert b.get('e4_reference_proof') is False
          print('unprivileged FALLBACK_ONLY ok')
          PY
      - name: Upload privileged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g04-privileged-net-audio-evidence
          path: artifacts/device_lab/g04_privileged/
