name: Phase XI user journeys
on:
  push:
    paths:
      - "gunnchos_device_os/phase_xi/**"
      - "user_journeys/**"
      - "tests/test_phase_xi_user_journeys.py"
      - ".github/workflows/phase-xi-user-journeys.yml"
  pull_request:
    paths:
      - "gunnchos_device_os/phase_xi/**"
      - "user_journeys/**"
      - "tests/test_phase_xi_user_journeys.py"
      - ".github/workflows/phase-xi-user-journeys.yml"
jobs:
  representative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip pytest pyyaml
      - name: Representative journeys + unit harness
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q tests/test_phase_xi_user_journeys.py
          python -m gunnchos_device_os.phase_xi.campaign --representative
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-xi-journey-evidence
          path: |
            artifacts/phase_xi/
            user_journeys/reports/
