name: Continuation IX digital release lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'continuation-ix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cont-ix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digital-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clean-env productivity packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libreoffice \
            firefox \
            poppler-utils \
            cups-client \
            wireguard-tools \
            qemu-system-arm
          command -v soffice || command -v libreoffice
          command -v firefox
          command -v pdftotext
          command -v lp
          command -v wg
          command -v wg-quick
          command -v qemu-system-aarch64

      - name: Install Python deps + SDK
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e ./sdk || true

      - name: Gate 1 Cont VIII recreation CI-safe reprove
        run: |
          PYTHONPATH=.:src pytest -q \
            tests/test_continuation_viii_release_readiness.py::test_recreation_reprove \
            tests/test_continuation_ix_digital_lock.py::test_gate1_recreation_reprove_ci_safe_without_siblings

      - name: Cont IX digital lock (require READY tokens)
        env:
          GUNNCHOS_CONT_IX_REQUIRE_READY: "1"
        run: |
          PYTHONPATH=.:src pytest -q tests/test_continuation_ix_digital_lock.py
          PYTHONPATH=.:src python3 -c "from gunnchos_device_os.cont_ix.digital_lock import evaluate_digital_lock; import json; r=evaluate_digital_lock(write=True); print(json.dumps({'ok':r['ok'],'token':r['token'],'earned':r['earned_tokens'],'digital_blockers':r['blockers']['DIGITAL']}, indent=2)); assert r['ok'] and not r['blockers']['DIGITAL']"
          test -f artifacts/continuation_ix/DIGITAL_RELEASE_LOCK.json
          test -f docs/release/CONTINUATION_IX_DIGITAL_LOCK.md

      - name: Upload Cont IX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-ix-digital-lock
          path: |
            artifacts/continuation_ix/**
            docs/release/CONTINUATION_IX_DIGITAL_LOCK.md
            docs/full_product/CONTINUATION_IX_DIGITAL_RELEASE_LOCK.md
            os_build/productivity_rootfs/**
          if-no-files-found: warn
          retention-days: 14
