device_id: handheld_hybrid
display_name: Handheld Hybrid
display:
  size_inches: 8.4
  resolution: "1920x1200"
  touch: true
  external_display: true
input:
  keyboard: dock_optional
  touch: true
  controller: true
  stylus: false
audio:
  speakers: true
  haptic: true
camera_mic:
  webcam: false
  mic: true
network:
  wifi: wifi_6e
  ethernet_dock_optional: true
  offline_capable: true
  cellular: simulated_generic
  # Research/sim NTN path only — not satellite certification or partner attach.
  ntn: simulated
storage:
  # WP-002 Outcome A — hardware truth is on-module 32GB eMMC + microSD expansion.
  # Do not invent carrier NVMe or larger Radxa eMMC SKUs.
  class: emmc
  min_gb: 32
  onboard_role: system_recovery_update_ai_nano_core
  expansion:
    microsd:
      required_for_mlp_user_content: true
      interface: SDMMC
    usb_attached:
      required_for_mlp: false
      role: optional_tertiary_archive_and_import
  reserves_gb:
    min_free_or_10pct: 2.976
    update_rollback: 2.0
    emergency_save: 0.5
  policy_ref: docs/HARDWARE_STORAGE_NETWORK_POLICY.md
memory:
  ram_gb: 8
battery:
  class: portable_extended
thermal:
  class: active_cooling
  throttle_policy: gaming_balanced
ports:
  - usb_c
  - gamepad_usb
dock:
  supported: true
  usb_c_dp_alt_mode: true
  tv_mode: true
sensors:
  - imu_placeholder
controller:
  supported: true
  hid_gamepad: true
keyboard:
  built_in: false
  dock_optional: true
touch:
  supported: true
accessibility:
  screen_reader_labels: true
  controller_navigation: true
  high_contrast_default: false
supported_modes: [School, Play, Media, Studio, Arcade, Guardian, Library, Offline]
supported_journey_presets: [scooter, bicycle, arcade, car, studio, offline, library]
supported_app_packs: [learn_pack, game_pack, music_pack, offline_essentials_pack]
developer_features:
  wsl_path: false
  light_coding: true
gaming_media_features:
  steam_path: true
  controller_first: true
  media_browser: true
creator_features:
  light_studio: true
research_features:
  limited_measurement: true
school_library_features:
  community_kiosk: true
guardian_features:
  play_time_window: true
offline_features:
  offline_games: true
  offline_lessons: true
known_gaps:
  - steam_compatibility_not_certified
  - battery_validation_pending
  - microsd_physical_endurance_pending
hardware_repo_source_paths:
  - gunnchos-hardware-industrial-design/mechanical_correctness/device_mechanical_targets.json#handheld_hybrid
  - gunnchos-hardware-industrial-design/docs/OS_HARDWARE_CONTRACT.md
  - gunnchos-hardware-industrial-design/npi/phase_xv/handheld_storage_headroom/HANDHELD_STORAGE_POLICY.md
claim_boundary: Profile mirror — not physical hardware validation. WP-002 Outcome A digital storage policy only.
