# Local OpenTelemetry Collector for gunnchos DEV plane round-trips.
# Receives OTLP/HTTP, writes JSON to /var/log/otel/traces.json for inspection.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
  attributes/gunnchos_privacy:
    actions:
      - key: email
        action: delete
      - key: enrollment_token
        action: delete
      - key: password
        action: delete
      - key: authorization
        action: delete

exporters:
  file:
    path: /var/log/otel/traces.json
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/gunnchos_privacy, batch]
      exporters: [file, logging]
