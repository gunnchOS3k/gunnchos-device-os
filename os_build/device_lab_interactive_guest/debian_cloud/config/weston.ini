[core]
backend=drm-backend.so
shell=desktop-shell.so
# Super (not Ctrl) so Ctrl+S reaches apps (mousepad/LibreOffice save) while
# weston desktop-shell Mod+s still owns the compositor screenshooter.
modifier=super
idle-time=0

[shell]
panel-position=top
locking=false
background-color=0xff224488

[screensaver]
path=
duration=0

# Single virtio-gpu max_outputs=2 exposes Virtual-1 + Virtual-2 on one DRM card.
# Dual PCI GPUs make weston bind only card0 (one wl_output) — do not use that path.
[output]
name=Virtual-1
mode=1280x800
position=0,0

[output]
name=Virtual-2
mode=1280x800
position=1280,0
